name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firewall-safety:
    name: Firewall safety audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit fail-open firewall invariants
        run: bash Scripts/audit_firewall_safety.sh

  monitor-build:
    name: Build monitor flavour
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate monitor project
        run: xcodegen generate --spec project.yml

      - name: Build monitor app without signing or profiles
        run: |
          xcodebuild \
            -project FreeSnitch.xcodeproj \
            -scheme FreeSnitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/monitor \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER='' \
            build

      - name: Verify monitor bundle has no restricted entitlements
        run: |
          APP=build/monitor/Build/Products/Release/FreeSnitch.app
          test -d "$APP"
          test -f "$APP/Contents/MacOS/FreeSnitch"
          test -f "$APP/Contents/MacOS/FreeSnitchHelper"
          test -f "$APP/Contents/Helpers/freesnitch"
          file "$APP/Contents/Helpers/freesnitch" | grep -Fq 'Mach-O'
          if grep -R -E -q \
            'com\.apple\.developer\.networking\.networkextension|com\.apple\.developer\.system-extension\.install' \
            "$APP"; then
            echo 'ERROR: restricted Network Extension entitlement leaked into the monitor build.'
            exit 1
          fi
          echo 'Monitor bundle verified without profiles or restricted entitlements.'

  portable-core:
    name: Portable core and Linux regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the shared core compiles without Apple frameworks
        run: bash Scripts/check_portable_core.sh

      - name: Test rule path scope security boundary
        run: bash Scripts/test_rule_path_scope.sh

      - name: Test IPC frame codec and oversize rejection
        run: bash Scripts/test_helper_frame.sh

      - name: Test version identity and non-fabrication
        run: bash Scripts/test_version_identity.sh

      - name: Test Linux peer authentication via SO_PEERCRED
        run: bash Scripts/test_peer_authenticator.sh

      - name: Test Unix socket transport correlation and timeouts
        run: bash Scripts/test_unix_socket_transport.sh

      - name: Test platform environment paths
        run: bash Scripts/test_platform_environment.sh

      - name: Test CLI platform gating and exit codes
        run: bash Scripts/test_cli_platform_gating.sh
